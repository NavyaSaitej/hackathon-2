stages:
  - lint-and-format
  - test
  - deadcode
  - security
  - deploy

lint-and-format:frontend:
  stage: lint-and-format
  script:
    - npm install @biomejs/biome prettier
    - npx @biomejs/biome check frontend/js/
    - npx prettier --check 'frontend/**/*.{js,css,html}'
  allow_failure: false

lint-and-format:backend:
  stage: lint-and-format
  script:
    - python -m pip install ruff
    - python -m ruff check backend/
    - python -m ruff format --check backend/
  allow_failure: false

test:backend:
  stage: test
  script:
    - python -m pip install -r backend/requirements.txt
    - python -m pip install pytest pytest-asyncio
    - python -m pytest backend/
  allow_failure: false

deadcode:backend:
  stage: deadcode
  script:
    - python -m pip install vulture
    - python -m vulture backend/ --exclude backend/venv --min-confidence 80
  allow_failure: true

security:backend:
  stage: security
  script:
    - python -m pip install bandit
    - python -m bandit -r backend/ -x backend/venv -s B101,B310
  allow_failure: false

pages:
  stage: deploy
  script:
    - python -c "import shutil, os; os.makedirs('public', exist_ok=True); shutil.copytree('frontend', 'public', dirs_exist_ok=True)"
  artifacts:
    paths:
      - public
  only:
    - main
