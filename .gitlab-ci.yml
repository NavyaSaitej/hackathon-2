stages:
  - lint
  - format
  - deadcode
  - security
  - deploy

lint:frontend:
  stage: lint
  script:
    - npm install @biomejs/biome
    - npx @biomejs/biome check frontend/js/
  allow_failure: false

lint:backend:
  stage: lint
  script:
    - python -m pip install ruff
    - python -m ruff check backend/
  allow_failure: false

format:frontend:
  stage: format
  script:
    - npm install prettier
    - npx prettier --check "frontend/**/*.{js,css,html}"
  allow_failure: false

format:backend:
  stage: format
  script:
    - python -m pip install ruff
    - python -m ruff format --check backend/
  allow_failure: false

deadcode:backend:
  stage: deadcode
  script:
    - python -m pip install vulture
    - python -m vulture backend/ --exclude backend/venv --min-confidence 80
  allow_failure: true

security:backend:
  stage: security
  script:
    - python -m pip install bandit
    - python -m bandit -r backend/ -x backend/venv -s B101,B310
  allow_failure: false

pages:
  stage: deploy
  script:
    - python -c "import shutil, os; os.makedirs('public', exist_ok=True); shutil.copytree('frontend', 'public', dirs_exist_ok=True)"
  artifacts:
    paths:
      - public
  only:
    - main
