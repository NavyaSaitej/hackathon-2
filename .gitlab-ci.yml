stages:
  - lint
  - test
  - deploy

lint:frontend:
  stage: lint
  image: node:20-alpine
  script:
    - npx @biomejs/biome check frontend/js/
  allow_failure: false

lint:backend:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check backend/
    - ruff format --check backend/
  allow_failure: false

test:backend:
  stage: test
  image: python:3.12-slim
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest httpx
    - pytest -v
  allow_failure: false

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r frontend/* public/
  artifacts:
    paths:
      - public
  only:
    - main
